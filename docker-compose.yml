version: '3.8'

services:
  bot:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    # Add healthcheck for better container management
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
